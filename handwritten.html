<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Handwritten Digit Predictor</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.11.0/dist/tf.min.js"></script>
</head>
<body>

<header>
  <nav class="navbar">
    <a href="index.html" class="logo">Ribizsár Benjámin</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="index.html#projects">Projects</a></li>
    </ul>
  </nav>
</header>

<main class="predictor">
  <h2>Handwritten Digit Predictor</h2>
  <p>Draw a digit (0–9) in the box and see what the AI predicts!</p>

  <canvas id="canvas" width="280" height="280"></canvas>

  <div class="predictor-controls">
    <button id="clearBtn" class="btn" type="button">Clear</button>
    <span id="prediction">Prediction: ?</span>
  </div>

  <p style="margin-top:1.5rem;">28×28 pixel input the model sees:</p>
  <canvas id="preview" width="28" height="28"></canvas>
  <p id="status" style="margin-top:1rem; color:#94a3b8;">Loading model…</p>
</main>

<footer>
  <p>© <span id="year">2026</span> Ribizsár Benjámin. All rights reserved.</p>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  let model;
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const preview = document.getElementById('preview');
  const pctx = preview.getContext('2d');
  const predictionEl = document.getElementById('prediction');
  const statusEl = document.getElementById('status');
  let drawing = false;
  let last = null;

  function resetCanvas() {
    ctx.fillStyle = 'black';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    pctx.fillStyle = 'black';
    pctx.fillRect(0, 0, preview.width, preview.height);
    predictionEl.textContent = 'Prediction: ?';
  }
  resetCanvas();

  (async function () {
    try {
      model = await tf.loadLayersModel('model/model.json');
      statusEl.textContent = 'Model loaded – start drawing.';
    } catch (err) {
      console.error(err);
      statusEl.textContent = 'Could not load the model. Please try again later.';
    }
  })();

  // Map pointer position to canvas pixels (the canvas is scaled with CSS)
  function pos(e) {
    const r = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) * canvas.width / r.width,
      y: (e.clientY - r.top) * canvas.height / r.height
    };
  }

  function draw(e) {
    if (!drawing) return;
    const p = pos(e);
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 20;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    last = p;
  }

  canvas.addEventListener('pointerdown', (e) => {
    drawing = true;
    last = pos(e);
    canvas.setPointerCapture(e.pointerId);
    draw(e);
  });
  canvas.addEventListener('pointermove', draw);
  canvas.addEventListener('pointerup', () => { drawing = false; predict(); });
  canvas.addEventListener('pointercancel', () => { drawing = false; });

  document.getElementById('clearBtn').addEventListener('click', resetCanvas);

  // Prepare the drawing like MNIST: crop to the digit, fit it in a 20×20 box,
  // then centre it by its centre of mass inside a 28×28 image.
  function toMnist() {
    const { width: w, height: h } = canvas;
    const data = ctx.getImageData(0, 0, w, h).data;
    let minX = w, minY = h, maxX = -1, maxY = -1;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        if (data[(y * w + x) * 4] > 30) {
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
    }
    // Ignore empty canvases and stray dots
    if (maxX < 0 || Math.max(maxX - minX, maxY - minY) < 40) {
      predictionEl.textContent = maxX < 0 ? 'Prediction: ?' : 'Draw a bigger digit';
      return false;
    }

    const bw = maxX - minX + 1, bh = maxY - minY + 1;
    const scale = 20 / Math.max(bw, bh);
    const sw = bw * scale, sh = bh * scale;

    // Draw the scaled digit once to find its centre of mass
    const tmp = document.createElement('canvas');
    tmp.width = tmp.height = 28;
    const tctx = tmp.getContext('2d');
    tctx.fillStyle = 'black';
    tctx.fillRect(0, 0, 28, 28);
    tctx.drawImage(canvas, minX, minY, bw, bh, (28 - sw) / 2, (28 - sh) / 2, sw, sh);
    const t = tctx.getImageData(0, 0, 28, 28).data;
    let sum = 0, cx = 0, cy = 0;
    for (let i = 0; i < 28 * 28; i++) {
      const v = t[i * 4];
      sum += v;
      cx += v * (i % 28);
      cy += v * Math.floor(i / 28);
    }
    const dx = 13.5 - cx / sum, dy = 13.5 - cy / sum;

    pctx.fillStyle = 'black';
    pctx.fillRect(0, 0, 28, 28);
    pctx.drawImage(canvas, minX, minY, bw, bh, (28 - sw) / 2 + dx, (28 - sh) / 2 + dy, sw, sh);
    return true;
  }

  function predict() {
    if (!toMnist() || !model) return;
    const probs = tf.tidy(() => {
      const tensor = tf.browser.fromPixels(preview, 1)
        .toFloat()
        .div(255.0)
        .reshape([1, 28, 28, 1]);
      return model.predict(tensor).dataSync();
    });
    const pIndex = probs.indexOf(Math.max(...probs));
    predictionEl.textContent = `Prediction: ${pIndex} (${Math.round(probs[pIndex] * 100)}% sure)`;
  }
</script>

</body>
</html>
