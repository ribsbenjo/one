<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Handwritten Digit Predictor</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.11.0/dist/tf.min.js"></script>
</head>
<body>

<header>
  <nav class="navbar">
    <h1 class="logo">Benjámin</h1>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="handwritten.html">Digit Predictor</a></li>
    </ul>
  </nav>
</header>

<main style="padding:4rem 1.5rem; text-align:center;">
  <h2>Handwritten Digit Predictor</h2>
  <p>Draw a digit (0-9) and see what the AI predicts!</p>
  
  <canvas id="canvas" width="700" height="700"
        style="border:1px solid #ccc; background:#111827;"></canvas>

<p style="margin-top:1rem;">28×28 pixel input preview:</p>
<canvas id="preview" width="28" height="28"
        style="border:1px solid #ccc; image-rendering: pixelated;"></canvas>

<div style="margin-top:1rem;">
  <button id="clearBtn" class="btn">Clear</button>
  <span id="prediction" style="margin-left:1rem; font-weight:bold;">Prediction: ?</span>
</div>

  <div style="margin-top:1rem;">
    <button id="clearBtn" class="btn">Clear</button>
    <span id="prediction" style="margin-left:1rem; font-weight:bold;">Prediction: ?</span>
  </div>
</main>

<footer style="text-align:center; padding:3rem 1rem; color:#94a3b8;">
  <p>© 2025 Ribizsár Benjámin. All rights reserved.</p>
</footer>

<script>
  // JS code for handwriting predictor (same as before)
  let model;
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let drawing = false;

  (async function() {
    model = await tf.loadLayersModel('https://storage.googleapis.com/tfjs-models/tfjs/mnist/model.json');
    console.log('Model loaded');
  })();

  canvas.addEventListener('mousedown', () => drawing = true);
  canvas.addEventListener('mouseup', () => drawing = false);
  canvas.addEventListener('mouseout', () => drawing = false);
  canvas.addEventListener('mousemove', draw);

  function draw(e){
    if(!drawing) return;
    ctx.fillStyle = "white";
    ctx.lineWidth = 15;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(e.offsetX, e.offsetY);
    ctx.lineTo(e.offsetX, e.offsetY);
    ctx.stroke();
  }

  document.getElementById('clearBtn').addEventListener('click', () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    document.getElementById('prediction').textContent = 'Prediction: ?';
  });

  canvas.addEventListener('mouseup', async () => {
    if(!model) return;
    const imgData = ctx.getImageData(0,0,canvas.width,canvas.height);
    let tensor = tf.browser.fromPixels(imgData,1)
      .resizeNearestNeighbor([28,28])
      .toFloat()
      .div(255.0)
      .reshape([1,28,28,1]);
    const prediction = model.predict(tensor);
    const pIndex = prediction.argMax(1).dataSync()[0];
    document.getElementById('prediction').textContent = 'Prediction: ' + pIndex;
  });
</script>

</body>
</html>
